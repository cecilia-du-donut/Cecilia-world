<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft fluid wet-on-wet watercolor gradient washes -->
    <linearGradient id="wc-grad-main" x1="6%" y1="92%" x2="94%" y2="8%">
      <stop offset="0%" stop-color="#c46684" />
      <stop offset="28%" stop-color="#9e3d5f" />
      <stop offset="58%" stop-color="#6c1e3d" />
      <stop offset="85%" stop-color="#48102a" />
      <stop offset="100%" stop-color="#35091d" />
    </linearGradient>

    <linearGradient id="wc-grad-rose-bleed" x1="0%" y1="75%" x2="88%" y2="18%">
      <stop offset="0%" stop-color="#eb9cb4" stop-opacity="0.72" />
      <stop offset="38%" stop-color="#cf6f8d" stop-opacity="0.56" />
      <stop offset="72%" stop-color="#8c2b4d" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#531430" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wc-grad-berry-pool" x1="88%" y1="88%" x2="18%" y2="14%">
      <stop offset="0%" stop-color="#3a0a21" stop-opacity="0.78" />
      <stop offset="44%" stop-color="#691b3b" stop-opacity="0.52" />
      <stop offset="78%" stop-color="#a84667" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#d47896" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wc-grad-center-glow" x1="22%" y1="15%" x2="76%" y2="85%">
      <stop offset="0%" stop-color="#d97b98" stop-opacity="0.54" />
      <stop offset="48%" stop-color="#9f3b5e" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#450e27" stop-opacity="0.12" />
    </linearGradient>

    <!-- Organic fluid distortion & feathered watercolor diffusion -->
    <filter id="wc-bloom" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0048" numOctaves="4" seed="17" result="warp-noise" />
      <feDisplacementMap in="SourceGraphic" in2="warp-noise" scale="220" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="52" />
    </filter>

    <!-- Watery backrun / pigment rim halos (lighter translucent center, subtly darker dried rim) -->
    <filter id="wc-halo" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="4" seed="29" result="edge-noise" />
      <feDisplacementMap in="SourceGraphic" in2="edge-noise" scale="135" xChannelSelector="G" yChannelSelector="B" result="edge-warped" />
      <feGaussianBlur in="edge-warped" stdDeviation="20" />
    </filter>

    <!-- Cold-press pigment granulation & mottled drying -->
    <filter id="wc-granulate" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="5" seed="43" result="gran" />
      <feColorMatrix type="matrix" values="0.35 0 0 0 0.14  0 0.15 0 0 0.03  0 0 0.24 0 0.07  0 0 0 0.32 0" in="gran" />
    </filter>
  </defs>

  <!-- Sweeping diagonal watercolor base wash -->
  <rect width="1600" height="1000" fill="url(#wc-grad-main)" />

  <!-- Organic wet-on-wet translucent color gradients & flowing pigment clouds -->
  <g filter="url(#wc-bloom)">
    <!-- Luminous diluted rose-blush wash sweeping from left & lower-left upward -->
    <path d="M-160,340 C110,210 430,290 610,490 C760,660 660,960 320,1080 L-180,1080 Z" fill="url(#wc-grad-rose-bleed)" />
    <path d="M-120,-80 C210,-100 540,10 610,230 C670,410 410,510 150,450 C-50,400 -160,180 -120,-80 Z" fill="url(#wc-grad-center-glow)" />

    <!-- Translucent mid-ground berry-rose gradient flowing toward the bag -->
    <path d="M520,140 C820,40 1170,150 1240,420 C1310,670 1050,870 720,810 C460,760 350,290 520,140 Z" fill="url(#wc-grad-center-glow)" opacity="0.88" />

    <!-- Deep moody wine-burgundy watercolor pools along top-right & lower-right -->
    <path d="M900,-140 L1700,-140 L1700,560 C1430,610 1170,510 1040,310 C930,140 840,0 900,-140 Z" fill="url(#wc-grad-berry-pool)" />
    <path d="M840,620 C1100,500 1480,550 1690,740 L1690,1100 L760,1100 C720,920 740,710 840,620 Z" fill="url(#wc-grad-berry-pool)" />
  </g>

  <!-- Delicate watercolor backruns / watered blooms & translucent pigment edges -->
  <g filter="url(#wc-halo)">
    <path d="M130,520 C270,460 440,540 420,700 C400,840 210,880 90,780 C-10,690 20,570 130,520 Z" fill="#e99ab3" fill-opacity="0.22" stroke="#781f40" stroke-opacity="0.24" stroke-width="18" />
    <path d="M620,250 C780,190 960,280 930,440 C900,590 710,630 580,530 C470,440 500,300 620,250 Z" fill="#d97b98" fill-opacity="0.18" stroke="#5b1533" stroke-opacity="0.22" stroke-width="16" />
    <path d="M1080,220 C1260,170 1450,270 1410,450 C1370,610 1160,650 1030,540 C910,440 940,260 1080,220 Z" fill="#460f28" fill-opacity="0.34" stroke="#2c0618" stroke-opacity="0.26" stroke-width="14" />
  </g>

  <!-- Uneven pigment granulation mottling across the watercolor paper -->
  <rect width="1600" height="1000" filter="url(#wc-granulate)" style="mix-blend-mode: multiply;" opacity="0.72" />
</svg>
