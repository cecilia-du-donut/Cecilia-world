<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Warm cream-blush luminous center melting softly into muted dusty-rose edges -->
    <radialGradient id="bf-center-glow" cx="50%" cy="48%" r="72%" fx="49%" fy="46%">
      <stop offset="0%" stop-color="#f8ece7" />
      <stop offset="34%" stop-color="#f0d9d7" />
      <stop offset="68%" stop-color="#e1bcc2" />
      <stop offset="100%" stop-color="#c695a0" />
    </radialGradient>

    <linearGradient id="bf-wash-cream" x1="12%" y1="14%" x2="86%" y2="86%">
      <stop offset="0%" stop-color="#faefe9" stop-opacity="0.68" />
      <stop offset="48%" stop-color="#f0d7d6" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#d8aeb6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bf-wash-dusty" x1="88%" y1="12%" x2="16%" y2="88%">
      <stop offset="0%" stop-color="#c3909c" stop-opacity="0.46" />
      <stop offset="50%" stop-color="#dbb4bc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f6e6e3" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bf-wash-blush" x1="82%" y1="84%" x2="22%" y2="20%">
      <stop offset="0%" stop-color="#ca99a5" stop-opacity="0.38" />
      <stop offset="54%" stop-color="#e7c6c9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f9eee9" stop-opacity="0" />
    </linearGradient>

    <!-- Soft wet-on-wet irregular watercolor bloom with zero sharp color borders -->
    <filter id="bf-bloom" x="-26%" y="-26%" width="152%" height="152%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="4" seed="27" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="220" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="58" />
    </filter>

    <!-- Ultra-soft watercolor backrun veil -->
    <filter id="bf-veil" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="15" result="edge-noise" />
      <feDisplacementMap in="SourceGraphic" in2="edge-noise" scale="130" xChannelSelector="G" yChannelSelector="B" result="edge-warped" />
      <feGaussianBlur in="edge-warped" stdDeviation="30" />
    </filter>

    <!-- Isotropic pigment granulation mottling (no directional stripes) -->
    <filter id="bf-granulate" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="5" seed="33" result="gran" />
      <feColorMatrix
        type="matrix"
        values="0.16 0 0 0 0.56  0 0.1 0 0 0.36  0 0 0.12 0 0.42  0 0 0 0.08 0"
        in="gran"
      />
    </filter>

    <!-- Fine non-directional cotton-linen watercolor paper tooth -->
    <filter id="bf-cotton-tooth" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="41" result="grain" />
      <feColorMatrix
        type="matrix"
        values="0.12 0 0 0 0.5  0 0.09 0 0 0.33  0 0 0.1 0 0.37  0 0 0 0.075 0"
        in="grain"
      />
    </filter>
  </defs>

  <!-- Warm cream-blush to soft dusty-rose radial watercolor ground -->
  <rect width="1600" height="1000" fill="url(#bf-center-glow)" />

  <!-- Organic irregular watercolor pigment washes across the paper -->
  <g filter="url(#bf-bloom)">
    <path d="M-140,220 C160,120 460,210 610,430 C740,630 510,920 200,1060 L-180,1060 Z" fill="url(#bf-wash-cream)" />
    <path d="M940,-140 L1700,-140 L1700,560 C1420,610 1150,480 1020,270 C920,110 880,-30 940,-140 Z" fill="url(#bf-wash-dusty)" />
    <path d="M400,160 C690,85 1040,165 1130,430 C1210,680 910,840 610,795 C320,750 250,270 400,160 Z" fill="#faeee8" opacity="0.58" />
    <path d="M840,620 C1120,540 1480,600 1700,790 L1700,1100 L760,1100 C730,920 755,700 840,620 Z" fill="url(#bf-wash-blush)" />
    <path d="M-120,-100 C240,-120 520,20 560,220 C600,400 340,460 110,390 C-60,330 -160,120 -120,-100 Z" fill="#e9c8cc" opacity="0.34" />
  </g>

  <!-- Ultra-soft translucent watercolor halos -->
  <g filter="url(#bf-veil)" opacity="0.52">
    <path d="M180,540 C310,470 480,550 450,700 C420,835 230,865 120,760 C30,670 65,595 180,540 Z" fill="#f5e3df" fill-opacity="0.3" />
    <path d="M1080,230 C1240,175 1420,270 1380,440 C1340,595 1140,625 1020,520 C910,425 945,275 1080,230 Z" fill="#d3a3ad" fill-opacity="0.22" />
  </g>

  <!-- Subtle organic pigment granulation & fine cotton-linen paper tooth (zero stripes) -->
  <rect width="1600" height="1000" filter="url(#bf-granulate)" style="mix-blend-mode: multiply;" />
  <rect width="1600" height="1000" filter="url(#bf-cotton-tooth)" style="mix-blend-mode: multiply;" />
</svg>
