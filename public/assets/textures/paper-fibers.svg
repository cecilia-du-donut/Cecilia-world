<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <!-- Cold-press rag paper tooth -->
    <filter id="paper-tooth" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="5" stitchTiles="stitch" seed="7" result="tooth" />
      <feColorMatrix type="matrix" values="0.24 0 0 0 0.44  0 0.22 0 0 0.34  0 0 0.2 0 0.38  0 0 0 0.32 0" in="tooth" />
    </filter>
    <!-- Soft aged tea-stain & vintage parchment mottling -->
    <filter id="vintage-mottle" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="4" stitchTiles="stitch" seed="19" result="clouds" />
      <feColorMatrix type="matrix" values="0.34 0 0 0 0.14  0 0.16 0 0 0.05  0 0 0.2 0 0.06  0 0 0 0.34 0" in="clouds" />
    </filter>
    <!-- Subtle traditional laid-paper rib weave -->
    <pattern id="laid-lines" width="18" height="18" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="18" y2="3" stroke="#fff0d9" stroke-width="0.45" stroke-opacity="0.08" />
      <line x1="0" y1="9" x2="18" y2="9" stroke="#260717" stroke-width="0.4" stroke-opacity="0.07" />
      <line x1="0" y1="15" x2="18" y2="15" stroke="#fff0d9" stroke-width="0.4" stroke-opacity="0.06" />
      <line x1="6" y1="0" x2="6" y2="18" stroke="#260717" stroke-width="0.35" stroke-opacity="0.045" />
    </pattern>
  </defs>

  <rect width="420" height="420" filter="url(#paper-tooth)" />
  <rect width="420" height="420" filter="url(#vintage-mottle)" opacity="0.82" />
  <rect width="420" height="420" fill="url(#laid-lines)" />

  <!-- Warm aged paper fibers (cream & hemp highlights) -->
