<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" fill="none">
  <defs>
    <filter id="heart-paper-grain" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="11" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.89  0 0 0 0 0.82  0 0 0 0.14 0" in="noise" result="tint" />
      <feBlend mode="soft-light" in="SourceGraphic" in2="tint" />
    </filter>
    <pattern id="heart-halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#8b2d52" fill-opacity="0.22" />
      <circle cx="7" cy="7" r="1.1" fill="#8b2d52" fill-opacity="0.18" />
    </pattern>
  </defs>
  <!-- Hand-torn vintage cream paper silhouette backing -->
  <path d="M89 156 L66 138 L44 120 L25 99 L14 75 L15 51 L27 31 L48 20 L70 22 L89 35 L108 20 L131 19 L153 29 L166 49 L166 74 L154 98 L134 120 L111 139 Z" fill="#fff0d9" filter="url(#heart-paper-grain)" />
