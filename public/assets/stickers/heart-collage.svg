  <path d="M89 140 C66 121 31 95 29 63 C28 43 44 31 61 33 C74 35 83 43 89 54 C95 43 105 34 118 32 C136 30 151 43 150 63 C148 95 113 121 89 140 Z" fill="#d9879f" fill-opacity="0.92" />
  <path d="M89 140 C66 121 31 95 29 63 C28 43 44 31 61 33 C74 35 83 43 89 54 C95 43 105 34 118 32 C136 30 151 43 150 63 C148 95 113 121 89 140 Z" fill="url(#heart-halftone)" />
  <!-- Delicate editorial burgundy ink sketch double outline -->
  <path d="M89 141 C64 122 30 95 29 63 C28 43 44 31 61 33 C74 35 83 43 89 54 C95 43 105 34 118 32 C136 30 151 43 150 63 C148 95 114 122 89 141 Z" stroke="#481a34" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" />
  <path d="M90 133 C70 117 40 94 38 66 C37 50 50 40 63 42 C74 43 82 50 88 60" stroke="#fff0d9" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.72" />
